<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>오늘 · 핀로그</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="apple-touch-icon" href="/assets/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f04438" />
  <script>document.documentElement.classList.add(window.Capacitor ? "dt-app" : "dt-web");</script>
  <link rel="stylesheet" href="/css/style.css?v=263" />
</head>
<body class="app-bg has-tabbar" data-kbresize="none">
  <!-- 일반 사용자 전용 모바일 홈 (수험생은 student-m.html) -->
  <script>
    if (window.matchMedia("(min-width: 601px)").matches) window.location.replace("/general.html");
  </script>


  <main class="container">
    <!-- 헤더: 상단 행(날짜 + D-Day + 아이콘) / 아래 인사말 -->
    <div class="mhead">
      <div class="mhead__top">
        <span class="mhead__date" id="g-date">오늘</span>
        <span class="mhead__dday" id="g-dday" hidden></span>
        <div class="mhead__icons">
          <a href="/alerts.html" class="mico" aria-label="알림">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          </a>
          <a href="/mypage.html" class="mico" aria-label="마이페이지">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="10" r="3.2"/><path d="M5.8 19a7.5 7.5 0 0 1 12.4 0"/></svg>
          </a>
        </div>
      </div>
      <p class="mgreet" id="g-greet" hidden></p>
    </div>

    <!-- 상단 요약 블록: 텍스트(좌) + 진행률 링(우) + 통계 행 -->
    <section class="card msum" id="g-summary" hidden>
      <div class="msum__main">
        <div class="msum__txt">
          <span class="msum__label">오늘의 진행률</span>
          <p class="msum__title">오늘 할 일 <em id="g-sum-done">0개</em> 완료했어요</p>
          <p class="msum__sub" id="g-sum-sub">작은 시작이 큰 변화를 만듭니다</p>
        </div>
        <div class="msum__ring">
          <svg viewBox="0 0 72 72">
            <circle cx="36" cy="36" r="30" fill="none" stroke="#f6ebe9" stroke-width="6.5"/>
            <circle id="g-sum-arc" cx="36" cy="36" r="30" fill="none" stroke="#f04438" stroke-width="6.5"
                    stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5"
                    transform="rotate(-90 36 36)"/>
          </svg>
          <div class="msum__ring-txt"><b id="g-sum-frac">0/0</b></div>
        </div>
      </div>
      <div class="msum__stats">
        <span><em data-en="Remaining">남은 할 일</em><b id="g-sum-left">0</b></span>
        <span><em data-en="Priority">우선순위</em><b id="g-sum-imp">0</b></span>
        <span><em data-en="Events today">오늘 일정</em><b id="g-sum-ev">0</b></span>
      </div>
    </section>

    <!-- 오늘 할 일 -->
    <section class="card gtodo">
      <div class="gtodo__head">
        <span class="gtodo__title" data-en="Today's tasks">오늘 할 일</span>
        <span class="gtodo__count" id="g-count" hidden>0/0 완료</span>
      </div>
      <div id="g-list"></div>
      <button type="button" class="gtodo__addbtn" id="g-add-row" data-en="+ Add a task">＋ 할 일 추가</button>
    </section>

    <!-- 어제 미완료 이월 안내 -->
    <div class="gcarry" id="g-carry" hidden>
      <span id="g-carry-text"></span>
      <button type="button" class="gcarry__btn" id="g-carry-btn" data-en="Move all to today">모두 오늘로</button>
    </div>

    <!-- 예정: 오늘 이후 날짜의 할 일 -->
    <section class="card gtodo" id="g-upcoming" hidden>
      <div class="gtodo__head">
        <span class="gtodo__title" data-en="Upcoming">예정</span>
      </div>
      <div id="g-upcoming-list"></div>
    </section>

    <!-- 오늘 일정 (Apple 캘린더) -->
    <section class="mevents" id="g-events" hidden>
      <div id="g-events-list"></div>
    </section>
  </main>

  <!-- 할 일 작성 시트 -->
  <div class="evsheet" id="gt-sheet" hidden>
    <div class="evsheet__backdrop" data-gt-close></div>
    <div class="evsheet__panel">
      <div class="evsheet__head">
        <button type="button" class="evsheet__cancel" data-gt-close data-en="Cancel">취소</button>
        <span class="evsheet__title" data-en="New task">새 할 일</span>
        <button type="button" class="evsheet__save" id="gt-save" data-en="Add">추가</button>
      </div>
      <input type="text" id="gt-input" class="field__input gt-input" placeholder="무엇을 해야 하나요?" data-en-ph="What do you need to do?"
             maxlength="200" autocomplete="off" enterkeyhint="done" />
      <div class="gt-chips" id="gt-when">
        <button type="button" class="gt-chip is-active" data-when="today" data-en="Today">오늘</button>
        <button type="button" class="gt-chip" data-when="tomorrow" data-en="Tomorrow">내일</button>
        <button type="button" class="gt-chip" data-when="pick" data-en="Pick a date">날짜 선택</button>
      </div>
      <input type="date" id="gt-date" class="field__input" hidden />
      <button type="button" class="gt-imp" id="gt-imp"><span class="gt-imp__star">★</span> <span data-en="Important">중요한 할 일</span></button>
      <div class="gt-tags" id="gt-tags"></div>
      <div class="catmgr__addrow" id="gt-tagadd" hidden>
        <input type="text" id="gt-tag-input" class="field__input" placeholder="새 태그 이름" maxlength="12" autocomplete="off" />
        <button type="button" class="catmgr__addbtn" id="gt-tag-btn">추가</button>
      </div>
    </div>
  </div>

  <!-- 스피드 다이얼: 할 일 · 일정 · 메모 · 파일 -->
  <div class="fabmenu" id="fabmenu">
    <div class="fabmenu__backdrop" hidden></div>
    <div class="fabmenu__items" hidden>
      <button type="button" class="fabmenu__item" id="fm-todo"><span data-en="Add task">할 일 추가</span><i>✓</i></button>
      <a href="/calendar.html?new=1" class="fabmenu__item"><span data-en="Add event">일정 추가</span><i>🗓</i></a>
      <a href="/memo-edit.html" class="fabmenu__item"><span data-en="Add note">메모 추가</span><i>✏️</i></a>
      <a href="/files.html?upload=1" class="fabmenu__item"><span data-en="Upload file">파일 업로드</span><i>📁</i></a>
    </div>
    <button type="button" class="fab" id="fab-toggle" aria-label="빠른 추가">＋</button>
  </div>
  <script>
    (function () {
      const menu = document.getElementById("fabmenu");
      const toggle = document.getElementById("fab-toggle");
      const items = menu.querySelector(".fabmenu__items");
      const back = menu.querySelector(".fabmenu__backdrop");
      function set(open) {
        menu.classList.toggle("is-open", open);
        items.hidden = !open;
        back.hidden = !open;
      }
      toggle.addEventListener("click", () => set(!menu.classList.contains("is-open")));
      back.addEventListener("click", () => set(false));
      document.getElementById("fm-todo").addEventListener("click", () => {
        set(false);
        document.getElementById("g-add-row").click();   // 할 일 작성 시트 열기
      });
    })();
  </script>

    <a href="/calendar.html" class="tabbar__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      <span>캘린더</span>
    </a>
    <a href="/memo.html" class="tabbar__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v6h5M8 13h8M8 17h5"/></svg>

    <a href="/files.html" class="tabbar__item">

      <span>파일</span>
    </a>
    <a href="/settings.html" class="tabbar__item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
      <span>설정</span>
    </a>
  </nav>
