<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>핀로그</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="apple-touch-icon" href="/assets/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f04438" />
  <script>document.documentElement.classList.add(window.Capacitor ? "dt-app" : "dt-web");</script>
  <link rel="stylesheet" href="/css/style.css?v=257" />
</head>
<body class="center-screen">
  <!-- 웹앱 진입점(/app) — 로그인 여부/역할에 따라 홈으로 라우팅 -->
  <div class="app-loader" style="position: fixed; inset: 0;">
    <div class="app-loader__inner">
      <div class="app-loader__brand">핀로그</div>
      <div class="app-loader__spinner"></div>
    </div>
  </div>

  <script src="/js/vendor/supabase.js"></script>
  <script src="/js/supabaseClient.js?v=mock19"></script>
  <script>
    (async () => {
      // 소셜 로그인 복귀(?code=)면 세션 교환이 끝날 때까지 잠시 대기 (레이스 방지)
      if (new URLSearchParams(location.search).has("code")) {
        for (let i = 0; i < 20; i++) {
          try {
            const { data } = await supabaseClient.auth.getSession();
            if (data && data.session) break;
          } catch (e) {}
          await new Promise((r) => setTimeout(r, 300));
        }
      }
      const profile = await getCurrentProfile();
      if (!profile) { window.location.href = "/login.html"; return; }
      if (!profile.onboarded) { window.location.href = "/onboarding.html"; return; }
      if (sessionStorage.getItem("dt_shared_shot")) { window.location.href = "/calendar.html"; return; }
      if (profile.role === "student") window.location.href = "/student.html";
      else window.location.href = "/admin.html";
    })();
  </script>
</body>
</html>
