<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />

  <link rel="apple-touch-icon" href="/assets/logo.png" />

    <div id="memo-list"></div>

    <!-- 웹 데스크톱 전용: 중앙 메모 에디터 -->
    <section class="mweb-editor" id="mweb-editor" hidden>
      <div class="mweb-editor__bar">
        <div class="fmtbar fmtbar--inline" id="mw-bar">
          <button type="button" data-cmd="bold" aria-label="굵게"><b>B</b></button>
          <button type="button" data-cmd="italic" aria-label="기울임"><i>I</i></button>
          <button type="button" data-cmd="underline" aria-label="밑줄"><u>U</u></button>
          <button type="button" data-cmd="strikeThrough" aria-label="취소선"><s>S</s></button>
          <span class="fmtbar__sep"></span>
          <button type="button" data-block="title" aria-label="제목">제목</button>
          <button type="button" data-block="head" aria-label="소제목">소제목</button>
          <span class="fmtbar__sep"></span>

        </div>
        <button type="button" class="mw-cat" id="mw-cat" hidden>📁 미분류</button>

        <span id="mw-status"></span>

           data-placeholder="메모를 선택하거나 새 메모를 작성하세요"></div>
    </section>

    <!-- 데스크탑 웹 전용: 계정 보관함 (목록+에디터 자리에 내장) -->
    <div id="vault-panel" hidden>
      <div class="vault-head">
        <b>🔐 계정 보관함</b>
        <span data-en="IDs & passwords — visible only to you">아이디·비밀번호 — 내 계정에서만 보여요</span>
        <button type="button" class="vault-add" id="va-add" data-en="+ Add account">＋ 계정 추가</button>

      <div class="vault-grid" id="va-list"></div>
      <p class="ac-empty" id="va-empty" hidden data-en="Nothing saved yet">아직 저장된 계정이 없어요 — 계정 추가를 눌러보세요</p>
    </div>

  <div class="evsheet" id="va-sheet" hidden>
    <div class="evsheet__backdrop" data-va-close></div>
    <div class="evsheet__panel">
      <div class="evsheet__head">
        <button type="button" class="evsheet__cancel" data-va-close data-en="Cancel">취소</button>
        <span class="evsheet__title" id="va-sheet-title">계정 추가</span>
        <button type="button" class="evsheet__save" id="va-save" data-en="Save">저장</button>
      </div>
      <label class="field ac-field"><span class="field__label" data-en="ID">아이디</span>
        <input type="text" id="va-id" class="field__input" autocomplete="off" autocapitalize="off" />
      </label>
      <label class="field ac-field"><span class="field__label" data-en="Password">비번</span>
        <span class="ac-pwwrap">
          <input type="password" id="va-pw" class="field__input" autocomplete="off" autocapitalize="off" />
          <button type="button" class="ac-eye" id="va-eye">👁</button>

      <label class="field ac-field"><span class="field__label" data-en="Email">이메일</span>

      <label class="field ac-field"><span class="field__label" data-en="Note">비고</span>

      </label>
      <button type="button" class="ac-del" id="va-del" hidden data-en="Delete this account">이 계정 삭제</button>
      <p class="evsheet__error" id="va-error" role="alert"></p>
    </div>
  </div>

    <div class="evsheet__backdrop" data-cat-close></div>

        <button type="button" class="catmgr__addbtn" id="cat-new-btn">추가</button>
      </div>
      <div id="cat-mgr-list"></div>
    </div>
  </div>

  <script src="/js/vendor/supabase.js"></script>
  <script src="/js/supabaseClient.js?v=mock19"></script>
  <script src="/js/utils.js?v=51"></script>
  <script src="/js/notify.js?v=6"></script>
  <script src="/js/memofmt.js?v=1"></script>
  <script>
    /* 메모 목록 — 아이폰 메모장식: 검색 + 좌측 스와이프로 고정/삭제 */
    document.addEventListener("DOMContentLoaded", async () => {
      const profile = await requireRole(["student"]);
      if (!profile) return;

      const listEl = document.getElementById("memo-list");
      const searchEl = document.getElementById("memo-search");
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      let memos = [];
      let categories = [];
      let activeCat = "all";      // "all" | "none" | category id
      let openRow = null;          // 현재 열려 있는 스와이프 행

      function when(iso) {
        const d = new Date(iso);
        const now = new Date();
        const p = (n) => String(n).padStart(2, "0");
        return d.toDateString() === now.toDateString()
          ? `오늘 ${fmtTime12(d)}`
          : `${d.getMonth() + 1}월 ${d.getDate()}일`;
      }

      function sorted(rows) {
        return [...rows].sort((a, b) => {
          if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
          return String(b.updated_at || "").localeCompare(String(a.updated_at || ""));
        });
      }

      function cardHtml(m) {
        const lines = MemoFmt.toText(m.content).split("\n").filter((l) => l.trim());
        const title = lines[0] || "새로운 메모";
        const body = lines.slice(1).join(" ").trim();
        return `
          <div class="memo-row" data-id="${m.id}">
            <div class="memo-row__actions">
              <button type="button" class="memo-act memo-act--pin" data-act="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 7 3 3H7l3-3z"/></svg><span>${m.pinned ? "해제" : "고정"}</span></button>
              <button type="button" class="memo-act memo-act--del" data-act="del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></svg><span>삭제</span></button>
            </div>
            <a href="/memo-edit.html?id=${m.id}" class="card memo-item${m.id === mwId ? " is-sel" : ""}">
              <span class="memo-item__title">${m.pinned ? '<span class="memo-item__pin">📌</span> ' : ""}${esc(title)}</span>
              <span class="memo-item__meta">
                <span class="memo-item__date">${when(m.updated_at || m.created_at)}</span>
                ${body ? `<span class="memo-item__body">${esc(body)}</span>` : ""}
              </span>
            </a>
          </div>`;
      }

      function closeOpen() {
        if (!openRow) return;
        openRow.classList.remove("is-open");
        openRow.querySelector(".memo-item").style.transform = "";
        openRow = null;
      }

      /* 좌측 스와이프 — 포인터 이벤트(터치·마우스 공통).
       * 가로 이동은 CSS touch-action: pan-y 가 브라우저 스크롤에서 떼어 준다. */
      const OPEN_X = -150;
      function wireSwipe(row) {
        const card = row.querySelector(".memo-item");
        let sx = 0, sy = 0, dx = 0, dir = null, active = false, moved = false;

        const setX = (x) => { card.style.transform = x ? `translateX(${x}px)` : ""; };

        card.addEventListener("pointerdown", (e) => {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          if (openRow && openRow !== row) closeOpen();
          sx = e.clientX; sy = e.clientY;
          dx = 0; dir = null; active = true; moved = false;
          card.style.transition = "none";
        });

        card.addEventListener("pointermove", (e) => {
          if (!active || DESK_SWIPE_OFF()) return;   // 웹 데스크톱은 스와이프 없음
          const mx = e.clientX - sx;
          const my = e.clientY - sy;
          if (!dir) {
            if (Math.abs(mx) < 6 && Math.abs(my) < 6) return;
            if (Math.abs(my) > Math.abs(mx)) { active = false; return; }   // 세로 스크롤에 양보
            dir = "x";
            try { card.setPointerCapture(e.pointerId); } catch (err) {}
          }
          moved = true;
          const base = row.classList.contains("is-open") ? OPEN_X : 0;
          dx = Math.max(OPEN_X - 40, Math.min(0, base + mx));              // 왼쪽으로만
          setX(dx);
        });

        const finish = () => {
          if (!active) return;
          active = false;
          card.style.transition = "";
          if (dir !== "x") return;
          if (dx < OPEN_X / 2) {
            setX(OPEN_X);
            row.classList.add("is-open");
            openRow = row;
          } else {
            setX(0);
            row.classList.remove("is-open");
            if (openRow === row) openRow = null;
          }
        };
        card.addEventListener("pointerup", finish);
        card.addEventListener("pointercancel", finish);
        card.addEventListener("dragstart", (e) => e.preventDefault());

        // 드래그 직후 또는 열린 상태의 탭은 메모 이동 대신 처리
        card.addEventListener("click", (e) => {
          if (moved || row.classList.contains("is-open")) {
            e.preventDefault();
            if (row.classList.contains("is-open") && !moved) closeOpen();
            moved = false;
          }
        });

        row.querySelectorAll("[data-act]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = row.dataset.id;
            const memo = memos.find((m) => m.id === id);
            if (!memo) return;
            if (btn.dataset.act === "pin") {
              const next = !memo.pinned;
              const { error } = await supabaseClient.from("memos").update({ pinned: next }).eq("id", id);
              if (!error) memo.pinned = next;
            } else {
              if (!confirm("이 메모를 삭제할까요?")) { closeOpen(); return; }
              const { error } = await supabaseClient.from("memos").delete().eq("id", id);
              if (!error) memos = memos.filter((m) => m.id !== id);
            }
            openRow = null;
            renderList();
          });
        });
      }

      /* ---------- 카테고리 (노션식 폴더) ---------- */
      function renderCats() {
        const el = document.getElementById("memo-cats");
        const uncategorized = memos.filter((m) => !m.category_id).length;
        let html = `<button type="button" class="memo-cat${!vaultOn && activeCat === "all" ? " is-active" : ""}" data-cat="all">전체 ${memos.length}</button>`;
        html += categories.map((c) => {
          const n = memos.filter((m) => m.category_id === c.id).length;
          return `<button type="button" class="memo-cat${!vaultOn && activeCat === c.id ? " is-active" : ""}" data-cat="${c.id}">${c.color ? `<i class="cat-dot" style="background:${c.color}"></i>` : ""}${esc(c.name)} ${n}</button>`;
        }).join("");
        if (uncategorized && categories.length) {
          html += `<button type="button" class="memo-cat${!vaultOn && activeCat === "none" ? " is-active" : ""}" data-cat="none">미분류 ${uncategorized}</button>`;
        }
        /* 계정 보관함: 데스크탑 웹은 워크스페이스 안에 내장, 모바일은 전용 페이지 */
        html += WEB_DESK()
          ? `<button type="button" class="memo-cat${vaultOn ? " is-active" : ""}" data-cat="__vault">🔐 ${dtT("계정", "Accounts")}</button>`
          : `<a class="memo-cat" href="/accounts.html">🔐 ${dtT("계정", "Accounts")}</a>`;
        html += `<button type="button" class="memo-cat memo-cat--add" data-cat="__manage">폴더 관리</button>`;
        el.innerHTML = html;

        el.querySelectorAll("[data-cat]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.cat;
            if (id === "__manage") { openCatSheet(); return; }
            if (id === "__vault") { showVault(true); return; }
            if (vaultOn) showVault(false);
            activeCat = id;
            renderCats();
            renderList();
          });
        });
      }

      /* 폴더 관리 시트: 추가 · 이름 인라인 수정 · 삭제 */
      const catSheet = document.getElementById("cat-sheet");
      const catInput = document.getElementById("cat-new-input");

      function openCatSheet() {
        renderCatManager();
        catInput.value = "";
        catSheet.hidden = false;
      }
      catSheet.querySelectorAll("[data-cat-close]").forEach((el2) =>
        el2.addEventListener("click", () => {
          catSheet.hidden = true;
          renderCats();
          renderList();
        }));

      function renderCatManager() {
        const listBox = document.getElementById("cat-mgr-list");
        if (!categories.length) {
          listBox.innerHTML = `<p class="catmgr__empty">아직 폴더가 없어요.<br/>위에서 첫 폴더를 만들어보세요.</p>`;
          return;
        }
        listBox.innerHTML = categories.map((c) => `
          <div class="catmgr__row" data-id="${c.id}">
            <button type="button" class="catmgr__dot" style="background:${c.color || CAT_COLORS[0]}" aria-label="색상 변경"></button>
            <input type="text" class="catmgr__name" value="${esc(c.name)}" maxlength="20" />
            <span class="catmgr__count">${memos.filter((m) => m.category_id === c.id).length}</span>
            <button type="button" class="catmgr__del" aria-label="삭제">삭제</button>
          </div>`).join("");

        listBox.querySelectorAll(".catmgr__row").forEach((row) => {
          const cid = row.dataset.id;
          const nameEl = row.querySelector(".catmgr__name");

          // 이름 인라인 수정 (블러/Enter 시 저장)
          const commit = async () => {
            const cat = categories.find((c) => c.id === cid);
            const name = nameEl.value.trim();
            if (!cat || !name || name === cat.name) { nameEl.value = cat ? cat.name : ""; return; }
            const { error } = await supabaseClient.from("memo_categories")
              .update({ name }).eq("id", cid);
            if (!error) cat.name = name; else nameEl.value = cat.name;
          };
          nameEl.addEventListener("blur", commit);
          nameEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); nameEl.blur(); }
          });

          row.querySelector(".catmgr__dot").addEventListener("click", async (ev) => {
            const cat = categories.find((c) => c.id === cid);
            if (!cat) return;
            const next = CAT_COLORS[(CAT_COLORS.indexOf(cat.color) + 1) % CAT_COLORS.length];
            const { error } = await supabaseClient.from("memo_categories")
              .update({ color: next }).eq("id", cid);
            if (!error) { cat.color = next; ev.currentTarget.style.background = next; }
          });

          row.querySelector(".catmgr__del").addEventListener("click", async () => {
            const cat = categories.find((c) => c.id === cid);
            if (!cat) return;
            const n = memos.filter((m) => m.category_id === cid).length;
            if (!confirm(n ? `'${cat.name}' 폴더를 삭제할까요?\n메모 ${n}개는 미분류로 이동합니다.` : `'${cat.name}' 폴더를 삭제할까요?`)) return;
            const { error } = await supabaseClient.from("memo_categories").delete().eq("id", cid);
            if (!error) {
              categories = categories.filter((c) => c.id !== cid);
              memos.forEach((m) => { if (m.category_id === cid) m.category_id = null; });
              if (activeCat === cid) activeCat = "all";
              renderCatManager();
            }
          });
        });
      }

      async function createCategory(name) {
        const text = name.trim();
        if (!text) return null;
        const { data, error } = await supabaseClient.from("memo_categories")
          .insert({ student_id: profile.id, name: text, sort: categories.length })
          .select().single();
        if (!error && data) { categories.push(data); return data; }
        return null;
      }
      document.getElementById("cat-new-btn").addEventListener("click", async () => {
        const made = await createCategory(catInput.value);
        if (made) { catInput.value = ""; renderCatManager(); }
      });
      catInput.addEventListener("keydown", async (e) => {
        if (e.key !== "Enter" || e.isComposing) return;
        e.preventDefault();
        const made = await createCategory(catInput.value);
        if (made) { catInput.value = ""; renderCatManager(); }
      });

      /* ---------- 웹 데스크톱 전용: 중앙 에디터 ---------- */
      const WEB_DESK = () => (document.documentElement.classList.contains("dt-web") ||
        document.documentElement.classList.contains("dt-app")) &&
        window.matchMedia("(min-width: 1100px)").matches;
      const DESK_SWIPE_OFF = WEB_DESK;
      const mwBody = document.getElementById("mw-body");
      const mwStatus = document.getElementById("mw-status");
      let mwId = null;
      let mwSaved = "";
      let mwTimer = null;

      function mwOpen(m) {
        mwId = m ? m.id : null;
        mwBody.innerHTML = m ? MemoFmt.toHtml(m.content || "") : "";
        mwSaved = MemoFmt.clean(mwBody.innerHTML);
        mwStatus.textContent = "";
        mwPaintCat();
        renderList();
        if (!m) mwBody.focus();
      }

      /* ---------- 웹 편집기: 폴더 이동 ---------- */
      const mwCatBtn = document.getElementById("mw-cat");
      const mwCatName = (cid) => {
        const c = categories.find((x) => x.id === cid);
        return c ? c.name : "미분류";
      };
      function mwPaintCat() {
        const m = memos.find((x) => x.id === mwId);
        mwCatBtn.hidden = !m;
        mwDelBtn.hidden = !m;
        if (m) mwCatBtn.textContent = "📁 " + mwCatName(m.category_id);
      }

      /* ---------- 웹 편집기: 현재 메모 삭제 ---------- */
      const mwDelBtn = document.getElementById("mw-del");
      mwDelBtn.addEventListener("click", async () => {
        if (!mwId) return;
        if (!confirm("이 메모를 삭제할까요?")) return;
        const { error } = await supabaseClient.from("memos").delete().eq("id", mwId);
        if (error) { alert("메모를 삭제하지 못했습니다."); return; }
        memos = memos.filter((m) => m.id !== mwId);
        mwId = null;
        renderCats();
        const next = sorted(memos.filter((m) =>
          activeCat === "all" ? true : activeCat === "none" ? !m.category_id : m.category_id === activeCat))[0];
        mwOpen(next || null);
      });
      mwCatBtn.addEventListener("click", () => {
        const old = document.getElementById("mwcat-menu");
        if (old) { old.remove(); return; }
        const menu = document.createElement("div");
        menu.id = "mwcat-menu";
        menu.className = "mwcat-menu";
        const cur = (memos.find((x) => x.id === mwId) || {}).category_id || null;
        menu.innerHTML =
          `<button type="button" data-cid="" class="${cur ? "" : "is-on"}">미분류</button>` +
          categories.map((c) =>
            `<button type="button" data-cid="${c.id}" class="${cur === c.id ? "is-on" : ""}">${esc(c.name)}</button>`).join("");
        document.body.appendChild(menu);
        const r = mwCatBtn.getBoundingClientRect();
        menu.style.left = Math.max(8, Math.min(window.innerWidth - 190, r.right - 180)) + "px";
        menu.style.top = (r.bottom + 6) + "px";
        const close = () => { menu.remove(); document.removeEventListener("pointerdown", onDoc, true); };
        const onDoc = (ev) => { if (!menu.contains(ev.target)) close(); };
        document.addEventListener("pointerdown", onDoc, true);
        menu.addEventListener("click", async (ev) => {
          const b = ev.target.closest("button[data-cid]");
          if (!b || !mwId) return;
          const cid = b.dataset.cid || null;
          close();
          await supabaseClient.from("memos").update({ category_id: cid }).eq("id", mwId);
          const m = memos.find((x) => x.id === mwId);
          if (m) m.category_id = cid;
          renderCats(); renderList(); mwPaintCat();
        });
      });

      async function mwSave() {
        const content = MemoFmt.clean(mwBody.innerHTML);
        if (content === mwSaved) return;
        if (!mwId && MemoFmt.isEmpty(content)) return;
        mwStatus.textContent = "저장 중…";
        try {
          if (mwId) {
            const { error } = await supabaseClient.from("memos").update({ content }).eq("id", mwId);
            if (error) throw error;
            const m = memos.find((x) => x.id === mwId);
            if (m) { m.content = content; m.updated_at = new Date().toISOString(); }
          } else {
            const catId = activeCat !== "all" && activeCat !== "none" ? activeCat : null;
            const { data, error } = await supabaseClient.from("memos")
              .insert({ student_id: profile.id, content, category_id: catId }).select().single();
            if (error) throw error;
            mwId = data.id;
            memos.unshift(data);
            renderCats();
          }
          mwSaved = content;
          mwStatus.textContent = "저장됨";
          setTimeout(() => { if (mwStatus.textContent === "저장됨") mwStatus.textContent = ""; }, 1500);
          renderList();
        } catch (e) { mwStatus.textContent = "저장 실패"; }
      }
      document.getElementById("mw-bar").querySelectorAll("button").forEach((b) => {
        b.addEventListener("mousedown", (e) => e.preventDefault());   // 선택 영역 유지
        b.addEventListener("click", () => {
          mwBody.focus();
          if (b.dataset.cmd) document.execCommand(b.dataset.cmd, false, null);
          else if (b.dataset.block) MemoFmt.applyBlock(b.dataset.block);
          mwBody.dispatchEvent(new Event("input"));
        });
      });
            mwBody.addEventListener("input", () => {
        clearTimeout(mwTimer);
        mwTimer = setTimeout(mwSave, 800);
      });
      window.addEventListener("pagehide", mwSave);

      // 목록에서 메모 클릭 → 페이지 이동 대신 에디터에 열기 (웹 데스크톱)
      listEl.addEventListener("click", (e) => {
        if (!WEB_DESK()) return;
        const a = e.target.closest ? e.target.closest('a[href^="/memo-edit.html"]') : null;
        if (!a) return;
        e.preventDefault();
        const row = a.closest(".memo-row");
        const m = row ? memos.find((x) => x.id === row.dataset.id) : null;
        mwSave();
        mwOpen(m || null);
      }, true);

      function renderList() {
        const q = searchEl.value.trim().toLowerCase();
        // 선택된 폴더로 먼저 거른 뒤 검색어 적용
        const byCat = activeCat === "all" ? memos
          : activeCat === "none" ? memos.filter((m) => !m.category_id)
          : memos.filter((m) => m.category_id === activeCat);
        const rows = sorted(q
          ? byCat.filter((m) => MemoFmt.toText(m.content).toLowerCase().includes(q))
          : byCat);

        if (memos.length && !byCat.length && !q) {
          listEl.innerHTML = `<p class="muted" style="text-align:center;margin:28px 0;">이 폴더에 메모가 없어요</p>`;
          return;
        }
        if (!memos.length) {
          listEl.innerHTML = `
            <div class="card memo-empty">
              <p class="memo-empty__title">아직 메모가 없어요</p>
              <p class="memo-empty__desc">떠오른 생각과 정리할 내용을 자유롭게 적어보세요</p>
              <a href="/memo-edit.html" class="btn btn--primary btn--lg">첫 메모 쓰기</a>
            </div>`;
          return;
        }
        if (!rows.length) { listEl.innerHTML = `<p class="muted">검색 결과가 없습니다.</p>`; return; }

        const pinned = rows.filter((m) => m.pinned);
        const rest = rows.filter((m) => !m.pinned);
        listEl.innerHTML =
          (pinned.length ? `<p class="memo-section">고정된 메모</p>` + pinned.map(cardHtml).join("") : "") +
          (rest.length ? (pinned.length ? `<p class="memo-section">메모</p>` : "") + rest.map(cardHtml).join("") : "");

        listEl.querySelectorAll(".memo-row").forEach(wireSwipe);
      }

      searchEl.addEventListener("input", () => { openRow = null; renderList(); });
      document.getElementById("memo-new").addEventListener("click", () => {
        if (WEB_DESK()) { mwSave(); mwOpen(null); return; }
        const cat = activeCat !== "all" && activeCat !== "none" ? "?cat=" + activeCat : "";
        window.location.href = "/memo-edit.html" + cat;
      });

      /* ---------- 계정 보관함 — 데스크탑 웹: 메모 자리에 내장 표시 ---------- */
      let vaultOn = false;
      let vaRows = null;                 // null = 아직 안 불러옴
      const vaShown = new Set();
      const vaPanel = document.getElementById("vault-panel");
      const vaList = document.getElementById("va-list");
      const vaSheet = document.getElementById("va-sheet");
      const vaId = document.getElementById("va-id");
      const vaPw = document.getElementById("va-pw");
      const vaEmail = document.getElementById("va-email");
      const vaNote = document.getElementById("va-note");
      const vaErr = document.getElementById("va-error");
      const vaDel = document.getElementById("va-del");
      let vaEditId = null;
      const vaMask = (s) => "•".repeat(Math.min(10, Math.max(6, String(s || "").length)));

      function showVault(on) {
        vaultOn = on;
        vaPanel.hidden = !on;
        document.body.classList.toggle("vault-on", on);
        renderCats();
        if (on) { vaRows === null ? loadVault() : renderVault(); }
      }
      async function loadVault() {
        const { data } = await supabaseClient.from("credentials")
          .select("*").eq("user_id", profile.id).order("created_at", { ascending: false });
        vaRows = data || [];
        renderVault();
      }
      function renderVault() {
        const rows = vaRows || [];
        document.getElementById("va-empty").hidden = rows.length > 0;
        vaList.innerHTML = rows.map((r) => `
          <section class="card ac-card" data-id="${r.id}">
            <div class="ac-card__title">🔐 ${esc(r.note || r.login_id || r.email || "계정")}</div>
            ${r.login_id ? `<div class="ac-row"><em>아이디</em><b>${esc(r.login_id)}</b><button type="button" data-copy="login_id">복사</button></div>` : ""}
            ${r.password ? `<div class="ac-row"><em>비번</em><b>${vaShown.has(r.id) ? esc(r.password) : vaMask(r.password)}</b><button type="button" data-act="eye">${vaShown.has(r.id) ? "숨김" : "보기"}</button><button type="button" data-copy="password">복사</button></div>` : ""}
            ${r.email ? `<div class="ac-row"><em>이메일</em><b>${esc(r.email)}</b><button type="button" data-copy="email">복사</button></div>` : ""}
          </section>`).join("");
      }
      vaList.addEventListener("click", async (e) => {
        const card = e.target.closest(".ac-card");
        if (!card) return;
        const row = (vaRows || []).find((r) => r.id === card.dataset.id);
        if (!row) return;
        const btn = e.target.closest("button");
        if (btn && btn.dataset.copy) {
          try {
            await navigator.clipboard.writeText(row[btn.dataset.copy] || "");
            btn.textContent = "복사됨 ✓";
            setTimeout(() => { btn.textContent = "복사"; }, 1200);
          } catch (err) {}
          return;
        }
        if (btn && btn.dataset.act === "eye") {
          vaShown.has(row.id) ? vaShown.delete(row.id) : vaShown.add(row.id);
          renderVault();
          return;
        }
        openVaultSheet(row);
      });
      function openVaultSheet(row) {
        vaEditId = row ? row.id : null;
        document.getElementById("va-sheet-title").textContent = row ? "계정 수정" : "계정 추가";
        vaId.value = row ? row.login_id || "" : "";
        vaPw.value = row ? row.password || "" : "";
        vaEmail.value = row ? row.email || "" : "";
        vaNote.value = row ? row.note || "" : "";
        vaPw.type = "password";
        vaDel.hidden = !row;
        vaErr.textContent = "";
        vaSheet.hidden = false;
        if (!row) setTimeout(() => vaId.focus(), 100);
      }
      document.getElementById("va-add").addEventListener("click", () => openVaultSheet(null));
      vaSheet.querySelectorAll("[data-va-close]").forEach((el) =>
        el.addEventListener("click", () => { vaSheet.hidden = true; }));
      document.getElementById("va-eye").addEventListener("click", () => {
        vaPw.type = vaPw.type === "password" ? "text" : "password";
      });
      document.getElementById("va-save").addEventListener("click", async () => {
        vaErr.textContent = "";
        const patch = {
          login_id: vaId.value.trim() || null,
          password: vaPw.value || null,
          email: vaEmail.value.trim() || null,
          note: vaNote.value.trim() || null,
          updated_at: new Date().toISOString(),
        };
        if (!patch.login_id && !patch.password && !patch.email) {
          vaErr.textContent = "아이디나 비번을 입력해주세요";
          return;
        }
        const q = vaEditId
          ? supabaseClient.from("credentials").update(patch).eq("id", vaEditId).select().single()
          : supabaseClient.from("credentials").insert({ user_id: profile.id, ...patch }).select().single();
        const { data, error } = await q;
        if (error) { vaErr.textContent = "저장하지 못했습니다"; return; }
        if (vaEditId) vaRows = (vaRows || []).map((r) => (r.id === vaEditId ? data : r));
        else vaRows = [data, ...(vaRows || [])];
        vaSheet.hidden = true;
        renderVault();
      });
      vaDel.addEventListener("click", async () => {
        if (!vaEditId || !confirm("이 계정 정보를 삭제할까요?")) return;
        const { error } = await supabaseClient.from("credentials").delete().eq("id", vaEditId);
        if (error) { vaErr.textContent = "삭제하지 못했습니다"; return; }
        vaRows = (vaRows || []).filter((r) => r.id !== vaEditId);
        vaSheet.hidden = true;
        renderVault();
      });

      const CACHE_KEY = "dtc_memos_" + profile.id;
      async function load() {
        const cached = !!memos.length;
        const stopSkel = cached ? () => {} : dtSkeleton(listEl, 4);
        const [memosRes, catsRes] = await Promise.all([
          supabaseClient.from("memos").select("*")
            .eq("student_id", profile.id).order("updated_at", { ascending: false }),
          supabaseClient.from("memo_categories").select("*")
            .eq("student_id", profile.id).order("sort").order("created_at"),
        ]);
        stopSkel();
        if (memosRes.error) { if (!cached) listEl.innerHTML = `<p class="muted">메모를 불러오지 못했습니다.</p>`; return; }
        memos = memosRes.data || [];
        categories = catsRes.data || [];
        try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ memos, categories })); } catch (e) {}
        renderCats();
        renderList();
      }
      /* 화면 전환 깜빡임 방지 — 직전 목록 즉시 표시 후 백그라운드 갱신 */
      try {
        const c = JSON.parse(sessionStorage.getItem(CACHE_KEY) || "null");
        if (c && Array.isArray(c.memos)) {
          memos = c.memos; categories = c.categories || [];
          renderCats(); renderList();
        }
      } catch (e) {}
      await load();
      if (WEB_DESK()) {
        document.getElementById("mweb-editor").hidden = false;
        const first = sorted(memos.filter((m) =>
          activeCat === "all" ? true : activeCat === "none" ? !m.category_id : m.category_id === activeCat))[0];
        if (first) mwOpen(first);
      }
      // 편집에서 돌아올 때(bfcache 복원) 최신 분류·내용을 다시 불러온다
      window.addEventListener("pageshow", (e) => { if (e.persisted) load(); });
    });
  </script>
</body>
</html>
