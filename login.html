<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>로그인 · 핀로그</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="apple-touch-icon" href="/assets/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <script>document.documentElement.classList.add(window.Capacitor ? "dt-app" : "dt-web");</script>
  <link rel="stylesheet" href="/css/style.css?v=240" />
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css");
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: #fff;
    }
    .nlogin {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 44px 26px calc(44px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
    }
    .nlogin__inner { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; }
    .nlogin__logo { width: 46px; height: 46px; border-radius: 11px; margin-bottom: 14px; }
    .nlogin__title { margin: 0 0 24px; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; color: #191919; text-align: center; }
    .lbtn {
      display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
      border: 1px solid #dcdcda; background: #fff; border-radius: 10px;
      padding: 12px 0; margin-bottom: 9px; font: inherit; font-size: 0.93rem; font-weight: 700;
      color: #191919; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .lbtn:active, .lbtn:hover { background: #f7f7f5; }
    .lbtn svg { width: 18px; height: 18px; }
    .lbtn--kakao { background: #fee500; border-color: #fee500; }
    .lbtn--kakao:active, .lbtn--kakao:hover { background: #f6dc00; }
    .lbtn--apple { background: #191919; border-color: #191919; color: #fff; }
    .lbtn--apple:active, .lbtn--apple:hover { background: #000; }
    .nlogin__div { display: flex; align-items: center; gap: 10px; width: 100%; margin: 14px 0; color: #c9c9c6; font-size: 0.76rem; }
    .nlogin__div::before, .nlogin__div::after { content: ""; flex: 1; height: 1px; background: #ededec; }
    .nlogin form { width: 100%; }
    .linput {
      width: 100%; box-sizing: border-box; border: 1px solid #dcdcda; border-radius: 10px;
      padding: 12px 14px; margin-bottom: 9px; font: inherit; font-size: 0.93rem; background: #fff;
    }
    .linput:focus { outline: 2px solid #ffece9; border-color: #f04438; }
    .nlogin__go {
      width: 100%; border: none; border-radius: 10px; background: #f04438; color: #fff;
      padding: 13px 0; font: inherit; font-size: 0.96rem; font-weight: 800; cursor: pointer; margin-top: 2px;
    }
    .nlogin__go:hover { filter: brightness(1.07); }
    #login-error { color: #f04438; font-size: 0.8rem; min-height: 1.2em; margin: 8px 2px 0; }
    #login-error:empty { display: none; }
    .nlogin__alt { margin-top: 16px; font-size: 0.86rem; color: #787774; }
    .nlogin__alt a { color: #f04438; font-weight: 700; text-decoration: none; }
    .nlogin__terms { margin-top: 26px; font-size: 0.76rem; color: #b9b9b6; text-align: center; line-height: 1.7; }
    .nlogin__terms a { color: #787774; }
    .demo-login { margin-top: 18px; width: 100%; }
  </style>
</head>
<body>
  <button type="button" class="auth-back" aria-label="뒤로 가기"
          onclick="if (history.length > 1) history.back(); else location.href='/welcome.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>

  <main class="nlogin">
    <div class="nlogin__inner">
      <img src="/assets/logo.png" alt="핀로그" class="nlogin__logo" onerror="this.style.display='none'" />
      <h1 class="nlogin__title">핀로그에 로그인</h1>

      <button type="button" class="lbtn lbtn--apple" id="apple-prov" hidden onclick="signInWithProvider('apple')">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.36 12.76c.03 3.26 2.86 4.34 2.9 4.36-.03.08-.46 1.56-1.5 3.09-.9 1.32-1.84 2.64-3.32 2.66-1.45.03-1.92-.86-3.58-.86-1.66 0-2.18.84-3.55.9-1.43.05-2.51-1.43-3.42-2.75-1.86-2.7-3.28-7.6-1.37-10.93.95-1.65 2.64-2.69 4.48-2.72 1.4-.03 2.72.94 3.58.94.85 0 2.46-1.16 4.15-1 .7.03 2.68.29 3.95 2.15-.1.06-2.36 1.38-2.32 4.16zM13.65 4.66c.75-.91 1.26-2.18 1.12-3.45-1.08.05-2.4.73-3.18 1.64-.7.8-1.31 2.1-1.15 3.34 1.21.1 2.45-.62 3.21-1.53z"/></svg>
        Apple로 계속하기
      </button>
      <button type="button" class="lbtn" onclick="signInWithProvider('google')">
        <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.41 5.41 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        구글로 계속하기
      </button>
      <button type="button" class="lbtn lbtn--kakao" onclick="signInWithProvider('kakao')">
        <svg viewBox="0 0 24 24" fill="#191919" aria-hidden="true"><path d="M12 3C6.48 3 2 6.46 2 10.7c0 2.72 1.83 5.1 4.58 6.47l-.93 3.42c-.08.3.26.55.53.38l4.1-2.7c.56.07 1.13.11 1.72.11 5.52 0 10-3.45 10-7.68C22 6.46 17.52 3 12 3Z"/></svg>
        카카오로 계속하기
      </button>

      <div class="nlogin__div">또는 이메일로</div>

      <form id="login-form" autocomplete="on">
        <input type="email" id="email" class="linput" placeholder="이메일" required autocomplete="email" />
        <input type="password" id="password" class="linput" placeholder="비밀번호" required autocomplete="current-password" />
        <p id="login-error" role="alert"></p>
        <button type="submit" class="nlogin__go">로그인</button>
      </form>

      <p class="nlogin__alt">계정이 없나요? <a href="/signup.html">가입하기</a></p>
      <p class="nlogin__terms">계속 진행하면 핀로그의 <a href="/privacy.html">개인정보처리방침</a>을<br />이해했으며 이에 동의하는 것으로 간주됩니다.</p>
    </div>
  </main>

  <script src="/js/vendor/supabase.js"></script>
  <script src="/js/supabaseClient.js?v=mock17"></script>
  <script>
    // Apple 로그인 버튼은 iOS 앱에서만 노출 (심사 요건: 소셜 로그인 제공 시 필수. Android는 미제공)
    if (window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === "ios") {
      document.getElementById("apple-prov").hidden = false;
    }
  </script>
  <script src="/js/auth.js?v=3"></script>
</body>
</html>
