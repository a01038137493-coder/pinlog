<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>로그인 · 핀로그</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="apple-touch-icon" href="/assets/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <script>document.documentElement.classList.add(window.Capacitor ? "dt-app" : "dt-web");</script>
  <link rel="stylesheet" href="/css/style.css?v=258" />
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css");
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: #fff;
    }
    .nlogin {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 44px 26px calc(44px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
    }
    .nlogin__inner { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
    .nlogin__logo { width: 52px; height: 52px; border-radius: 12px; margin-bottom: 26px; }
    .nlogin__title { margin: 0; font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; color: #191919; text-align: center; line-height: 1.35; }
    .nlogin__sub { margin: 4px 0 34px; font-size: 1.3rem; font-weight: 700; color: #b9b9b6; letter-spacing: -0.02em; }
    .nlogin form { width: 100%; text-align: left; }
    .nlogin__label { display: block; font-size: 0.82rem; font-weight: 600; color: #787774; margin: 0 2px 6px; }
    .linput {
      width: 100%; box-sizing: border-box; border: 1px solid #dcdcda; border-radius: 10px;
      padding: 13px 14px; font: inherit; font-size: 0.95rem; background: #fff; margin-bottom: 12px;
    }
    .linput:focus { outline: 2px solid #ffd9d4; border-color: #f04438; }
    .ntip {
      background: #f2f1ef; border-radius: 10px; padding: 13px 15px;
      font-size: 0.86rem; color: #37352f; line-height: 1.55; margin-bottom: 14px; word-break: keep-all;
    }
    .ntip b { font-weight: 700; }
    .nlogin__go {
      width: 100%; border: none; border-radius: 10px; background: #f04438; color: #fff;
      padding: 14px 0; font: inherit; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 2px;
    }
    .nlogin__go:hover { filter: brightness(1.07); }
    .nlogin__go:disabled { opacity: 0.6; cursor: default; }
    #login-error { color: #f04438; font-size: 0.82rem; min-height: 1.2em; margin: 8px 2px 0; }
    #login-error:empty { display: none; }
    #login-error a { color: #f04438; font-weight: 700; }
    .otp-note { font-size: 0.86rem; color: #787774; margin: 0 2px 12px; word-break: keep-all; line-height: 1.6; }
    .otp-note b { color: #37352f; }
    .otp-actions { display: flex; justify-content: space-between; margin-top: 14px; font-size: 0.84rem; }
    .otp-actions button { border: none; background: none; font: inherit; font-size: 0.84rem; font-weight: 600; color: #787774; cursor: pointer; padding: 0; }
    .otp-actions button:hover { color: #37352f; text-decoration: underline; }
    .otp-boxes { display: flex; gap: 9px; justify-content: center; margin-bottom: 14px; }
    .otp-d {
      width: 52px; height: 62px; text-align: center;
      font: inherit; font-size: 1.5rem; font-weight: 800; color: #191919;
      border: 1px solid #dcdcda; border-radius: 12px; background: #fff;
    }
    .otp-d:focus { outline: 2px solid #ffd9d4; border-color: #f04438; }

    .nlogin__div { display: flex; align-items: center; gap: 12px; width: 100%; margin: 26px 0 20px; color: #9b9a97; font-size: 0.84rem; }
    .nlogin__div::before, .nlogin__div::after { content: ""; flex: 1; height: 1px; background: #ededec; }
    .nlogin__provs { display: flex; gap: 10px; width: 100%; justify-content: center; }
    .nprov {
      flex: 1; max-width: 168px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 20px 10px 16px; border: 1px solid #e3e2e0; border-radius: 12px;
      background: #fff; font: inherit; font-size: 0.92rem; font-weight: 600; color: #37352f;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .nprov:hover, .nprov:active { background: #f7f7f5; }
    .nprov svg { width: 28px; height: 28px; }
    .nlogin__alt { margin-top: 30px; font-size: 0.95rem; color: #787774; }
    .nlogin__alt a { color: #37352f; font-weight: 600; text-decoration: underline; }
    .nlogin__terms { margin-top: 26px; font-size: 0.78rem; color: #b9b9b6; text-align: center; line-height: 1.7; }
    .nlogin__terms a { color: #787774; text-decoration: underline; }
    .demo-login { margin-top: 18px; width: 100%; }
  </style>
</head>
<body>
  <button type="button" class="auth-back" aria-label="뒤로 가기"
          onclick="if (history.length > 1) history.back(); else location.href='/welcome.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>

  <main class="nlogin">
    <div class="nlogin__inner">
      <img src="/assets/logo.png" alt="핀로그" class="nlogin__logo" onerror="this.style.display='none'" />
      <h1 class="nlogin__title" data-en="Your day, planned and logged">계획하고 기록하는 나만의 하루</h1>
      <p class="nlogin__sub" data-en="Log in to Pinlog">핀로그 계정에 로그인</p>

      <!-- 1단계: 이메일 -->
      <form id="li-email-form">
        <span class="nlogin__label" data-en="Email">이메일</span>
        <input type="email" id="li-email" class="linput" placeholder="이메일 주소를 입력하세요" data-en-ph="Enter your email" required autocomplete="email" />
        <div class="ntip" data-en="Tip: no password needed — we'll email you a 6-digit code to log in."><b>팁:</b> 비밀번호가 필요 없어요. 이 주소로 전송되는 6자리 인증 코드로 로그인합니다.</div>
        <button type="submit" class="nlogin__go" id="li-go" data-en="Continue">계속</button>
      </form>

      <!-- 2단계: 인증 코드 -->
      <form id="li-otp-form" hidden>
        <p class="otp-note"><b id="otp-email"></b> 으로 보낸<br />6자리 인증 코드를 입력해주세요.</p>
        <div class="otp-boxes">
          <input type="text" class="otp-d" inputmode="numeric" maxlength="1" autocomplete="one-time-code" />
          <input type="text" class="otp-d" inputmode="numeric" maxlength="1" />
          <input type="text" class="otp-d" inputmode="numeric" maxlength="1" />
          <input type="text" class="otp-d" inputmode="numeric" maxlength="1" />
          <input type="text" class="otp-d" inputmode="numeric" maxlength="1" />
          <input type="text" class="otp-d" inputmode="numeric" maxlength="1" />
        </div>
        <button type="submit" class="nlogin__go" id="otp-go" data-en="Log in">로그인</button>
        <div class="otp-actions">
          <button type="button" id="otp-edit" data-en="Edit email">이메일 수정</button>
          <button type="button" id="otp-resend" data-en="Resend code">코드 재전송</button>
        </div>
      </form>

      <!-- 내부 계정(@pinlog.app — 데모·앱스토어 심사용): 비밀번호 로그인 -->
      <form id="li-pw-form" hidden>
        <span class="nlogin__label" data-en="Password">비밀번호</span>
        <input type="password" id="li-pw" class="linput" placeholder="비밀번호를 입력하세요" data-en-ph="Enter your password" autocomplete="current-password" />
        <button type="submit" class="nlogin__go" id="pw-go" data-en="Log in">로그인</button>
        <div class="otp-actions">
          <button type="button" id="pw-edit" data-en="Edit email">이메일 수정</button>
        </div>
      </form>

      <p id="login-error" role="alert"></p>

      <div class="nlogin__div" data-en="or continue with">또는 다음으로 계속하기</div>

      <div class="nlogin__provs">
        <button type="button" class="nprov" onclick="signInWithProvider('google')">
          <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.41 5.41 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          Google
        </button>
        <button type="button" class="nprov" id="apple-prov" hidden onclick="signInWithProvider('apple')">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.36 12.76c.03 3.26 2.86 4.34 2.9 4.36-.03.08-.46 1.56-1.5 3.09-.9 1.32-1.84 2.64-3.32 2.66-1.45.03-1.92-.86-3.58-.86-1.66 0-2.18.84-3.55.9-1.43.05-2.51-1.43-3.42-2.75-1.86-2.7-3.28-7.6-1.37-10.93.95-1.65 2.64-2.69 4.48-2.72 1.4-.03 2.72.94 3.58.94.85 0 2.46-1.16 4.15-1 .7.03 2.68.29 3.95 2.15-.1.06-2.36 1.38-2.32 4.16zM13.65 4.66c.75-.91 1.26-2.18 1.12-3.45-1.08.05-2.4.73-3.18 1.64-.7.8-1.31 2.1-1.15 3.34 1.21.1 2.45-.62 3.21-1.53z"/></svg>
          Apple
        </button>
        <button type="button" class="nprov" onclick="signInWithProvider('kakao')">
          <svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6.5" fill="#FEE500"/><path fill="#3C1E1E" d="M13 6.2c-4 0-7.2 2.5-7.2 5.6 0 2 1.3 3.7 3.3 4.7-.1.4-.7 2.4-.7 2.5 0 0 0 .12.06.17.08.05.17.01.17.01.23-.03 2.6-1.7 3-2 .45.06.9.1 1.37.1 4 0 7.2-2.5 7.2-5.6S17 6.2 13 6.2z"/></svg>
          <span data-en="Kakao">카카오</span>
        </button>
      </div>

      <p class="nlogin__alt"><span data-en="New to Pinlog?">신규 사용자이신가요?</span> <a href="/signup.html" data-en="Sign up">가입하기</a></p>
      <p class="nlogin__terms"><span data-en="By continuing, you agree to Pinlog's ">계속 진행하면 핀로그의 </span><a href="/privacy.html" data-en="Privacy Policy">개인정보처리방침</a><span data-en=".">을<br />이해했으며 이에 동의하는 것으로 간주됩니다.</span></p>
    </div>
  </main>

  <script src="/js/vendor/supabase.js"></script>
  <script src="/js/supabaseClient.js?v=mock19"></script>
  <script src="/js/utils.js?v=46"></script>
  <script>
    // Apple 로그인 버튼은 iOS 앱에서만 노출 (심사 요건: 소셜 로그인 제공 시 필수. Android는 미제공)
    if (window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform() === "ios") {
      document.getElementById("apple-prov").hidden = false;
    }

    // 비밀번호 없는 로그인: 이메일 → 6자리 인증 코드(OTP)
    document.addEventListener("DOMContentLoaded", async () => {
      // 이미 로그인돼 있으면 목적지로
      const nextParam = new URLSearchParams(location.search).get("next");
      const appHome = window.Capacitor ? "/index.html" : "/app";
      const dest = nextParam && nextParam.startsWith("/") && !nextParam.startsWith("//") ? nextParam : appHome;
      try { if (await getCurrentUser()) { window.location.href = dest; return; } } catch (e) {}

      const errParam = new URLSearchParams(location.search).get("err");
      if (errParam) document.getElementById("login-error").textContent = "소셜 로그인 실패: " + errParam;
      const emailForm = document.getElementById("li-email-form");
      const otpForm = document.getElementById("li-otp-form");
      const err = document.getElementById("login-error");
      const goBtn = document.getElementById("li-go");
      const otpBtn = document.getElementById("otp-go");
      const otpBoxes = [...document.querySelectorAll(".otp-d")];
      let email = "";
      let cooldown = 0;

      async function sendCode() {
        const { error } = await supabaseClient.auth.signInWithOtp({
          email,
          options: { shouldCreateUser: false },
        });
        if (error) throw error;
      }

      // 6칸 박스: 자동 이동 · 백스페이스 뒤로 · 붙여넣기 분배 · 완성 시 자동 제출
      otpBoxes.forEach((box, i) => {
        box.addEventListener("input", () => {
          box.value = box.value.replace(/\D/g, "").slice(0, 1);
          if (box.value && i < 5) otpBoxes[i + 1].focus();
          if (otpBoxes.every((b) => b.value)) otpForm.requestSubmit();
        });
        box.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && !box.value && i > 0) otpBoxes[i - 1].focus();
        });
        box.addEventListener("paste", (e) => {
          e.preventDefault();
          const digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6).split("");
          digits.forEach((d, j) => { if (otpBoxes[j]) otpBoxes[j].value = d; });
          const last = Math.min(digits.length, 6) - 1;
          if (last >= 0) otpBoxes[last].focus();
          if (digits.length === 6) otpForm.requestSubmit();
        });
      });

      emailForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.textContent = "";
        email = document.getElementById("li-email").value.trim();
        if (!email) return;
        goBtn.disabled = true; goBtn.textContent = "확인 중...";
        try {
          const { data: exists } = await supabaseClient.rpc("email_exists", { p_email: email });
          if (!exists) {
            err.innerHTML = '가입되지 않은 이메일이에요. <a href="/signup.html">가입하기</a>';
            return;
          }
          if (/@pinlog\.app$/i.test(email)) {       // 내부 계정은 메일 수신 불가 → 비밀번호
            emailForm.hidden = true;
            document.getElementById("li-pw-form").hidden = false;
            document.getElementById("li-pw").focus();
            return;
          }
          goBtn.textContent = "코드 전송 중...";
          await sendCode();
          document.getElementById("otp-email").textContent = email;
          emailForm.hidden = true;
          otpForm.hidden = false;
          otpBoxes[0].focus();
          cooldown = Date.now() + 60000;
        } catch (e2) {
          err.textContent = "인증 코드를 보내지 못했어요. 잠시 후 다시 시도해주세요.";
        } finally {
          goBtn.disabled = false; goBtn.textContent = "계속";
        }
      });

      otpForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.textContent = "";
        const token = otpBoxes.map((b) => b.value).join("");
        if (token.length !== 6) { err.textContent = "6자리 코드를 입력해주세요."; return; }
        otpBtn.disabled = true; otpBtn.textContent = "확인 중...";
        const { error } = await supabaseClient.auth.verifyOtp({ email, token, type: "email" });
        if (error) {
          err.textContent = "코드가 올바르지 않거나 만료됐어요. 다시 확인해주세요.";
          otpBtn.disabled = false; otpBtn.textContent = "로그인";
          otpBoxes.forEach((b) => { b.value = ""; });
          otpBoxes[0].focus();
          return;
        }
        window.location.href = dest;
      });

      const pwForm = document.getElementById("li-pw-form");
      pwForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.textContent = "";
        const pw = document.getElementById("li-pw").value;
        if (!pw) return;
        const btn = document.getElementById("pw-go");
        btn.disabled = true; btn.textContent = "확인 중...";
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pw });
        if (error) {
          err.textContent = "비밀번호가 올바르지 않아요.";
          btn.disabled = false; btn.textContent = "로그인";
          return;
        }
        window.location.href = dest;
      });
      document.getElementById("pw-edit").addEventListener("click", () => {
        pwForm.hidden = true;
        emailForm.hidden = false;
        err.textContent = "";
      });

      document.getElementById("otp-edit").addEventListener("click", () => {
        otpForm.hidden = true;
        emailForm.hidden = false;
        err.textContent = "";
      });

      document.getElementById("otp-resend").addEventListener("click", async (ev) => {
        if (Date.now() < cooldown) {
          err.textContent = "잠시 후 다시 시도해주세요 (" + Math.ceil((cooldown - Date.now()) / 1000) + "초)";
          return;
        }
        err.textContent = "";
        ev.target.disabled = true;
        try { await sendCode(); cooldown = Date.now() + 60000; err.textContent = "코드를 다시 보냈어요."; }
        catch (e2) { err.textContent = "재전송에 실패했어요. 잠시 후 다시 시도해주세요."; }
        finally { ev.target.disabled = false; }
      });
    });
  </script>
</body>
</html>
