<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>클립보드 · 핀로그</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="apple-touch-icon" href="/assets/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f04438" />
  <script>document.documentElement.classList.add(window.Capacitor ? "dt-app" : "dt-web");</script>
  <link rel="stylesheet" href="/css/style.css?v=260" />
</head>
<body class="app-bg">
  <header class="topbar">
    <a href="/settings.html" class="topbar__back" aria-label="뒤로 가기" onclick="if(history.length>1){history.back();return false;}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="topbar__brand" data-en="Clipboard">클립보드</div>
    <span></span>
  </header>

  <main class="container clip">
    <!-- 저장 영역 -->
    <section class="card clip__composer">
      <button type="button" class="btn btn--primary btn--block clip__grab" id="clip-grab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2.5" width="8" height="4" rx="1.4"/><path d="M16 4.5h2.6A1.4 1.4 0 0 1 20 5.9v14.2a1.4 1.4 0 0 1-1.4 1.4H5.4A1.4 1.4 0 0 1 4 20.1V5.9a1.4 1.4 0 0 1 1.4-1.4H8"/><path d="M9 12h6M9 16h4"/></svg>
        <span data-en="Save what I just copied">복사한 내용 저장하기</span>
      </button>
      <textarea id="clip-input" class="clip__input" rows="2" placeholder="또는 여기에 붙여넣고 추가하세요" data-en-ph="…or paste here and add"></textarea>
      <div class="clip__composer-foot">
        <label class="clip__auto"><input type="checkbox" id="clip-auto" /> <span data-en="Auto-save clipboard when I return to this tab">이 탭에 돌아오면 클립보드 자동 저장</span></label>
        <button type="button" class="clip__addbtn" id="clip-add" data-en="Add">추가</button>
      </div>
    </section>

    <p class="clip__hint" data-en="Copy on one device, click an item on another to copy it there. Syncs instantly.">한 기기에서 저장하면 다른 기기 목록에 바로 떠요. 항목을 누르면 그 기기의 클립보드로 복사됩니다.</p>

    <div id="clip-list"></div>

    <section class="card alempty" id="clip-empty" hidden>
      <p class="alempty__title" data-en="Nothing here yet">아직 저장된 내용이 없어요</p>
      <p class="alempty__sub" data-en="Copy something and press the button above — it will appear on all your devices.">복사한 뒤 위 버튼을 누르면 모든 기기에서 볼 수 있어요.</p>
    </section>
  </main>

  <script src="/js/vendor/supabase.js"></script>
  <script src="/js/supabaseClient.js?v=mock19"></script>
  <script src="/js/utils.js?v=47"></script>
  <script>
    /* 기기 간 클립보드 브리지 — clips 테이블 + Supabase 실시간 */
    document.addEventListener("DOMContentLoaded", async () => {
      const user = await requireAuth();
      if (!user) return;

      const listEl = document.getElementById("clip-list");
      const emptyEl = document.getElementById("clip-empty");
      const input = document.getElementById("clip-input");
      const autoCk = document.getElementById("clip-auto");
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      const ua = navigator.userAgent;
      const DEVICE =
        window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()
          ? (/iPad/.test(ua) ? "iPad" : /iPhone/.test(ua) ? "iPhone" : "Android")
          : /Windows/.test(ua) ? "Windows" : /Mac/.test(ua) ? "Mac" : /Android/.test(ua) ? "Android" : "Web";

      let clips = [];
      let lastSaved = "";      // 자동 저장 중복 방지

      function when(iso) {
        const d = new Date(iso);
        const diff = (Date.now() - d.getTime()) / 60000;
        if (diff < 1) return dtT("방금", "just now");
        if (diff < 60) return Math.floor(diff) + dtT("분 전", "m ago");
        if (diff < 1440) return Math.floor(diff / 60) + dtT("시간 전", "h ago");
        return `${d.getMonth() + 1}/${d.getDate()}`;
      }

      function render() {
        const sorted = [...clips].sort((a, b) =>
          ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) ||
          String(b.created_at).localeCompare(String(a.created_at)));
        emptyEl.hidden = sorted.length > 0;
        listEl.innerHTML = sorted.map((c) => `
          <div class="card clip__row${c.pinned ? " is-pinned" : ""}" data-id="${c.id}">
            <button type="button" class="clip__body" data-act="copy" title="${dtT("클립보드로 복사", "Copy to clipboard")}">
              <span class="clip__text">${esc(c.content)}</span>
              <span class="clip__meta">${c.pinned ? "📌 " : ""}${esc(c.device || "")} · ${when(c.created_at)}</span>
            </button>
            <span class="clip__acts">
              <button type="button" data-act="pin" title="${dtT("고정", "Pin")}">${c.pinned ? "📌" : "📍"}</button>
              <button type="button" data-act="del" title="${dtT("삭제", "Delete")}">✕</button>
            </span>
          </div>`).join("");
        listEl.querySelectorAll(".clip__row").forEach((row) => {
          const id = row.dataset.id;
          row.querySelector('[data-act="copy"]').addEventListener("click", async () => {
            const c = clips.find((x) => x.id === id);
            if (!c) return;
            try {
              await navigator.clipboard.writeText(c.content);
              lastSaved = c.content;                     // 복사해온 걸 자동 저장이 다시 올리지 않게
              showToast(dtT("클립보드로 복사했어요", "Copied to clipboard"), "success");
            } catch (e) { showToast(dtT("복사하지 못했어요", "Couldn't copy"), "error"); }
          });
          row.querySelector('[data-act="pin"]').addEventListener("click", async () => {
            const c = clips.find((x) => x.id === id);
            if (!c) return;
            c.pinned = !c.pinned;
            render();
            await supabaseClient.from("clips").update({ pinned: c.pinned }).eq("id", id);
          });
          row.querySelector('[data-act="del"]').addEventListener("click", async () => {
            clips = clips.filter((x) => x.id !== id);
            render();
            await supabaseClient.from("clips").delete().eq("id", id);
          });
        });
      }

      async function load() {
        const { data } = await supabaseClient.from("clips")
          .select("*").eq("user_id", user.id)
          .order("created_at", { ascending: false }).limit(100);
        clips = data || [];
        render();
      }

      async function add(text, silent) {
        const content = String(text || "").trim().slice(0, 10000);
        if (!content) return false;
        if (clips.some((c) => c.content === content)) {     // 동일 내용 중복 방지
          if (!silent) showToast(dtT("이미 저장돼 있어요", "Already saved"), "info");
          return false;
        }
        lastSaved = content;
        const { data, error } = await supabaseClient.from("clips")
          .insert({ user_id: user.id, content, device: DEVICE }).select().single();
        if (error) { if (!silent) showToast(dtT("저장하지 못했어요", "Couldn't save"), "error"); return false; }
        if (!clips.some((c) => c.id === data.id)) clips.unshift(data);
        render();
        if (!silent) showToast(dtT("저장했어요 — 다른 기기에서 바로 보여요", "Saved — visible on your other devices"), "success");
        return true;
      }

      document.getElementById("clip-grab").addEventListener("click", async () => {
        try {
          const text = await navigator.clipboard.readText();
          if (!text || !text.trim()) { showToast(dtT("클립보드가 비어 있어요", "Clipboard is empty"), "info"); return; }
          add(text);
        } catch (e) {
          showToast(dtT("클립보드 접근이 막혀 있어요. 아래 칸에 붙여넣어 주세요", "Clipboard access blocked — paste into the box below"), "error");
          input.focus();
        }
      });

      document.getElementById("clip-add").addEventListener("click", async () => {
        if (await add(input.value)) input.value = "";
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) document.getElementById("clip-add").click();
      });

      /* 자동 캡처: 탭에 돌아왔을 때 클립보드가 새 내용이면 저장 (기기별 설정) */
      const AUTO_KEY = "dt_clip_auto";
      autoCk.checked = localStorage.getItem(AUTO_KEY) === "1";
      autoCk.addEventListener("change", () => {
        localStorage.setItem(AUTO_KEY, autoCk.checked ? "1" : "0");
        if (autoCk.checked) autoGrab();
      });
      async function autoGrab() {
        if (!autoCk.checked || !document.hasFocus()) return;
        try {
          const text = await navigator.clipboard.readText();
          if (text && text.trim() && text.trim() !== lastSaved.trim()) await add(text, true);
        } catch (e) {}
      }
      window.addEventListener("focus", autoGrab);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) autoGrab(); });

      /* 실시간: 다른 기기에서 추가·삭제되면 즉시 반영 */
      try {
        supabaseClient.channel("clips-live")
          .on("postgres_changes",
            { event: "*", schema: "public", table: "clips", filter: "user_id=eq." + user.id },
            (payload) => {
              if (payload.eventType === "INSERT") {
                if (!clips.some((c) => c.id === payload.new.id)) { clips.unshift(payload.new); render(); }
              } else if (payload.eventType === "DELETE") {
                clips = clips.filter((c) => c.id !== payload.old.id);
                render();
              } else if (payload.eventType === "UPDATE") {
                const i = clips.findIndex((c) => c.id === payload.new.id);
                if (i >= 0) { clips[i] = payload.new; render(); }
              }
            })
          .subscribe();
      } catch (e) {}

      await load();
      autoGrab();
    });
  </script>
</body>
</html>
